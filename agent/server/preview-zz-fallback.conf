# /etc/apache2/sites-available/preview-zz-fallback.conf
#
# Machine-wide pieces of the preview scheme (docs/preview-hosts.md):
#  - every http://*.preview1... request is sent to https;
#  - an https hostname whose prefix belongs to no account lands here instead of
#    on whichever vhost Apache would otherwise pick first. The "zz" keeps this
#    file last in sites-enabled, after every preview-<account>.conf, because
#    Apache gives the first vhost whose ServerAlias matches.
<VirtualHost *:80>
    ServerName preview1.rosenthaltechnologies.com
    ServerAlias *.preview1.rosenthaltechnologies.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=302]
</VirtualHost>

<VirtualHost *:443>
    ServerName preview1.rosenthaltechnologies.com
    ServerAlias *.preview1.rosenthaltechnologies.com
    DocumentRoot /var/www/preview-fallback
    <Directory /var/www/preview-fallback>
        Require all granted
    </Directory>
    ErrorDocument 404 /index.html

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/preview1.rosenthaltechnologies.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/preview1.rosenthaltechnologies.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog  ${APACHE_LOG_DIR}/preview-fallback-error.log
    CustomLog ${APACHE_LOG_DIR}/preview-fallback-access.log vhost_combined
</VirtualHost>
