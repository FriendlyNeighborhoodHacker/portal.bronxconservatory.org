<svg xmlns="http://www.w3.org/2000/svg" width="240" height="2400" viewBox="0 0 240 2400">
  <!-- Left-margin strip of faint grey instrument line art for the family-facing
       pages (see body.instrument-bg in styles.css; instruments-right.svg and
       instruments-top.svg are its siblings). The strip repeats down the
       page; the last ~220px are deliberately empty so the wrap-around at the
       top of the page leaves room for the top band. -->
  <defs>
    <g id="fiddle" fill="none">
      <path d="M 0,2 C 20,0 34,10 33,24 C 32,38 20,44 19,57 C 18,70 30,76 36,88 C 42,100 44,124 0,134 C -44,124 -42,100 -36,88 C -30,76 -18,70 -19,57 C -20,44 -32,38 -33,24 C -34,10 -20,0 0,2 Z"/>
      <path d="M -4,2 L -4,-38 M 4,2 L 4,-38"/>
      <path d="M -4,-38 C -7,-48 -4,-54 0,-56 C 6,-59 10,-53 6,-49 C 3,-46 0,-49 2,-52"/>
      <path d="M 11,62 C 15,70 7,80 11,90 M -11,62 C -15,70 -7,80 -11,90"/>
    </g>
    <g id="guitar" fill="none">
      <path d="M 0,0 C 18,0 28,10 28,24 C 28,36 21,40 21,48 C 21,58 34,64 34,80 C 34,98 18,106 0,106 C -18,106 -34,98 -34,80 C -34,64 -21,58 -21,48 C -21,40 -28,36 -28,24 C -28,10 -18,0 0,0 Z"/>
      <circle cx="0" cy="52" r="11"/>
      <path d="M -11,84 L 11,84"/>
      <path d="M -3.5,0 L -3.5,-48 M 3.5,0 L 3.5,-48"/>
      <path d="M -3.5,-48 L -6,-50 L -6,-68 L 6,-68 L 6,-50 L 3.5,-48"/>
    </g>
    <g id="mic" fill="none">
      <circle cx="0" cy="0" r="16"/>
      <path d="M -15.2,-5 L 15.2,-5 M -15.2,5 L 15.2,5"/>
      <path d="M -11.6,11 L 11.6,11"/>
      <path d="M -10.5,12 L -6,54 C -6,60 6,60 6,54 L 10.5,12"/>
    </g>
    <g id="notes2">
      <ellipse cx="0" cy="34" rx="7" ry="5.5" transform="rotate(-18 0 34)"/>
      <ellipse cx="34" cy="28" rx="7" ry="5.5" transform="rotate(-18 34 28)"/>
      <path fill="none" d="M 6.5,32 L 6.5,-4 M 40.5,26 L 40.5,-10"/>
      <path fill="none" d="M 6.5,-4 L 40.5,-10 M 6.5,4 L 40.5,-2"/>
