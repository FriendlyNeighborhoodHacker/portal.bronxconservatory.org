      <path fill="none" d="M -48,44 L 48,44"/>
      <path fill="none" d="M -40,44 L -40,55 M -32,44 L -32,55 M -24,44 L -24,55 M -16,44 L -16,55 M -8,44 L -8,55 M 0,44 L 0,55 M 8,44 L 8,55 M 16,44 L 16,55 M 24,44 L 24,55 M 32,44 L 32,55 M 40,44 L 40,55"/>
    </g>
    <g id="bass" fill="none">
      <path d="M 0,4 C 14,2 24,12 25,28 C 26,44 20,50 19,62 C 18,76 32,82 38,96 C 46,112 44,138 0,148 C -44,138 -46,112 -38,96 C -32,82 -18,76 -19,62 C -20,50 -26,44 -25,28 C -24,12 -14,2 0,4 Z"/>
