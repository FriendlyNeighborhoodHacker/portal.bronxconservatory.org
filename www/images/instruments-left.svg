  <g stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <use href="#guitar" stroke="#e2e5eb" transform="translate(120,140) rotate(-18) scale(1.05)"/>
    <g fill="#e2e5eb" stroke="#e2e5eb" transform="translate(55,300) rotate(-8)"><use href="#notes2"/></g>
    <use href="#fiddle" stroke="#e2e5eb" transform="translate(140,445) rotate(14) scale(0.85)"/>
    <g stroke="#e2e5eb" fill="#e2e5eb" stroke-width="2.3" transform="translate(55,605) rotate(-6)"><use href="#keys"/></g>
    <use href="#mic" stroke="#e2e5eb" stroke-width="2.2" transform="translate(165,755) rotate(22) scale(1.15)"/>
    <use href="#fiddle" stroke="#e2e5eb" transform="translate(110,930) rotate(-14)"/>
    <g fill="#e2e5eb" stroke="#e2e5eb" transform="translate(185,1105) rotate(14)"><use href="#note1"/></g>
    <g stroke="#e2e5eb" stroke-width="2.1" transform="translate(120,1260) rotate(8) scale(1.15)">
      <use href="#fiddle"/>
      <path d="M 0,134 L 0,156"/>
    </g>
    <g fill="#e2e5eb" stroke="#e2e5eb" transform="translate(60,1500) rotate(10)"><use href="#notes2"/></g>
    <g stroke="#e2e5eb" fill="#e2e5eb" transform="translate(120,1650) rotate(10) scale(1.05)"><use href="#grand"/></g>
    <g fill="#e2e5eb" stroke="#e2e5eb" transform="translate(55,1790) rotate(-12) scale(0.9)"><use href="#note1"/></g>
    <use href="#bass" stroke="#e2e5eb" stroke-width="2" transform="translate(120,1960) rotate(-6) scale(1.3)"/>
